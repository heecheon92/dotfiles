# Process-scoped low-cost model overlay. Launch with `omp-budget`.
# The normal config remains authoritative for every setting not listed here.
modelRoles:
  default: openrouter/z-ai/glm-5.3-flash:max
  smol: openai-codex/gpt-6-luna:medium
  spark: openai-codex/gpt-5.3-codex-spark:high
  slow: openrouter/z-ai/glm-5.3-flash:max
  vision: openai-codex/gpt-6-luna:high
  plan: openrouter/z-ai/glm-5.3:high
  commit: openai-codex/gpt-6-luna:low
  task: openrouter/z-ai/glm-5.3-flash:max
  advisor: openai-codex/gpt-6-sol:high
  judge: openrouter/~typesafe/jev-latest
cycleOrder:
  - spark
  - smol
  - default
  - slow
retry:
  fallbackChains:
    default:
      - openrouter/z-ai/glm-5.3-flash:high
      - openrouter/deepseek/deepseek-v4.1-flash:high
    smol:
      - openrouter/z-ai/glm-5.3-flash:low
      - openrouter/deepseek/deepseek-v4.1-flash:low
    slow:
      - openrouter/z-ai/glm-5.3-flash:max
      - openai-codex/gpt-6-luna:xhigh
    vision:
      - openrouter/z-ai/glm-5.3-flash:high
      - openrouter/deepseek/deepseek-v4.1-flash:high
    plan:
      - openrouter/z-ai/glm-5.3-flash:high
      - openai-codex/gpt-6-luna:xhigh
    commit:
      - openrouter/z-ai/glm-5.3-flash:low
      - openrouter/deepseek/deepseek-v4.1-flash:low
    task:
      - openrouter/z-ai/glm-5.3-flash:high
      - openrouter/deepseek/deepseek-v4.1-flash:high
    advisor:
      - openrouter/z-ai/glm-5.3-flash:max
      - openai-codex/gpt-6-luna:xhigh
