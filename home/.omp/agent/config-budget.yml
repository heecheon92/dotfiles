# Process-scoped low-cost model overlay. Launch with `omp-budget`.
# The normal config remains authoritative for every setting not listed here.
modelRoles:
  default: openai-codex/gpt-5.6-sol:medium
  smol: openai-codex/gpt-5.6-luna:medium
  slow: openai-codex/gpt-5.6-luna:max
  vision: openai-codex/gpt-5.6-luna:high
  plan: openai-codex/gpt-5.6-terra:high
  commit: openai-codex/gpt-5.6-luna:low
  task: openai-codex/gpt-5.6-luna:xhigh
  advisor: openai-codex/gpt-5.6-sol:high
retry:
  fallbackChains:
    default:
      - openai-codex/gpt-5.4-mini:high
      - openai-codex/gpt-5.6-terra:medium
    smol:
      - openai-codex/gpt-5.4-mini:low
      - openai-codex/gpt-5.6-terra:low
    slow:
      - openai-codex/gpt-5.4-mini:xhigh
      - openai-codex/gpt-5.6-luna:xhigh
    vision:
      - openai-codex/gpt-5.4-mini:high
      - openai-codex/gpt-5.6-terra:medium
    plan:
      - openai-codex/gpt-5.4-mini:high
      - openai-codex/gpt-5.6-luna:xhigh
    designer:
      - openai-codex/gpt-5.6-terra:high
      - openai-codex/gpt-5.4-mini:high
    commit:
      - openai-codex/gpt-5.4-mini:low
      - openai-codex/gpt-5.6-terra:low
    task:
      - openai-codex/gpt-5.4-mini:high
      - openai-codex/gpt-5.6-terra:medium
    advisor:
      - openai-codex/gpt-5.4-mini:xhigh
      - openai-codex/gpt-5.6-luna:xhigh
