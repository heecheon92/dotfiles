# Opt-in overlay: inherit every setting except these roles and fallback chains.
# Keep tiny/local titles and judge/JEV inherited; other roles use Codex OAuth.
modelRoles:
  default: openai-codex/gpt-6-astra:high
  smol: openai-codex/gpt-6-astra:xhigh
  spark: openai-codex/gpt-6-astra:low
  slow: openai-codex/gpt-6-astra:max
  vision: openai-codex/gpt-6-astra:xhigh
  plan: openai-codex/gpt-6-astra:max
  commit: openai-codex/gpt-6.1-sol:medium
  task: openai-codex/gpt-6-astra:xhigh
  advisor: openai-codex/gpt-6-astra:max
  memory: openai-codex/gpt-6-astra:medium
retry:
  # Codex role chains never fall through to Claude or OpenRouter; judge keeps JEV.
  # These alternatives cannot recover from a Codex-wide outage or exhausted account.
  fallbackChains:
    default:
      - openai-codex/gpt-6.1-sol:high
      - openai-codex/gpt-6-luna:high
    smol:
      - openai-codex/gpt-6.1-sol:xhigh
      - openai-codex/gpt-6-luna:xhigh
    spark:
      - openai-codex/gpt-6.1-sol:low
      - openai-codex/gpt-6-luna:low
    slow:
      - openai-codex/gpt-6.1-sol:max
      - openai-codex/gpt-6-luna:max
    vision:
      - openai-codex/gpt-6.1-sol:xhigh
      - openai-codex/gpt-6-luna:xhigh
    plan:
      - openai-codex/gpt-6.1-sol:max
      - openai-codex/gpt-6-luna:max
    commit:
      - openai-codex/gpt-6-astra:medium
      - openai-codex/gpt-6-luna:medium
    task:
      - openai-codex/gpt-6.1-sol:xhigh
      - openai-codex/gpt-6-luna:xhigh
    advisor:
      - openai-codex/gpt-6.1-sol:max
      - openai-codex/gpt-6-luna:max
    memory:
      - openai-codex/gpt-6.1-sol:medium
      - openai-codex/gpt-6-luna:medium
    # Keep local helpers local.
    tiny: []
