setupVersion: 2
modelRoles:
  default: openai-codex/gpt-5.6-sol:medium
  smol: openai-codex/gpt-5.6-terra:medium
  spark: openai-codex/gpt-5.3-codex-spark:high
  slow: openai-codex/gpt-5.6-sol:xhigh
  vision: openai-codex/gpt-5.6-sol:medium
  plan: openai-codex/gpt-5.6-sol:high
  # designer: anthropic/claude-opus-5:high
  designer: stealth/ox-alpha:high
  commit: openai-codex/gpt-5.6-terra:medium
  task: openai-codex/gpt-5.6-terra:high
  advisor: openai-codex/gpt-5.6-sol:high
cycleOrder:
  - spark
  - smol
  - default
  - slow
theme:
  dark: dark-monokai-readable
  light: dark-monokai-readable
symbolPreset: nerd
statusLine:
  preset: custom
  separator: powerline-thin
  contextLine: off
  leftSegments: [pi, hostname, model, mode, path, git, pr, subagents]
  rightSegments: [session_name, token_rate, cost, time_spent, time]
  segmentOptions:
    model: { showThinkingLevel: true }
    path: { abbreviate: true, maxLength: 30 }
    git: { showBranch: true, showStaged: true, showUnstaged: true, showUntracked: true }
    time: { format: 24h, showSeconds: true }
autocompleteMaxVisible: 20
defaultThinkingLevel: high
personality: pragmatic
providers:
  autoThinkingMaxEffort: xhigh
  openaiWebsockets: auto
  tinyModel: qwen3-0.6b
  tinyModelDevice: default
  tinyModelDtype: default
tier:
  openai: priority
retry:
  enabled: true
  maxRetries: 4
  baseDelayMs: 500
  maxDelayMs: 30000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-terra:high
      - openai-codex/gpt-5.6-luna:high
    smol:
      - openai-codex/gpt-5.6-luna:high
      - openai-codex/gpt-5.6-sol:low
    slow:
      - openai-codex/gpt-5.6-terra:xhigh
      - openai-codex/gpt-5.6-sol:high
    vision:
      - openai-codex/gpt-5.6-terra:high
    plan:
      - openai-codex/gpt-5.6-terra:xhigh
      - openai-codex/gpt-5.6-sol:medium
    designer:
      - openai-codex/gpt-5.6-sol:medium
      - openai-codex/gpt-5.6-terra:high
    commit:
      - openai-codex/gpt-5.6-terra:low
    task:
      - openai-codex/gpt-5.6-sol:low
      - openai-codex/gpt-5.6-luna:xhigh
    advisor:
      - openai-codex/gpt-5.6-terra:xhigh
dev:
  autoqaConsent: granted
display:
  hideToolActivity: false
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: false
task:
  agentModelOverrides:
    security-reviewer: "@advisor"
  eager: preferred
  enableEffort: false
terminal:
  showImages: true
images:
  autoResize: true
  blockImages: false
hideThinkingBlock: true
composer:
  shape: box
