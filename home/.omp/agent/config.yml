setupVersion: 2
modelRoles:
  default: openai-codex/gpt-6-astra:medium
  smol: openai-codex/gpt-6-luna:high
  spark: openai-codex/gpt-6-luna:medium
  slow: openai-codex/gpt-6-astra:xhigh
  vision: openai-codex/gpt-6-astra:medium
  plan: openai-codex/gpt-6-astra:xhigh
  commit: openai-codex/gpt-6-luna:medium
  task: openai-codex/gpt-6.1-sol:high
  advisor: openai-codex/gpt-6-astra:high
  tiny: local/lfm2.5-230m
  memory: openai-codex/gpt-6-luna
  judge: openrouter/~typesafe/jev-latest
title:
  generator: tiny
  icons: nf+emoji
cycleOrder:
  - spark
  - smol
  - default
  - slow
theme:
  dark: monokai-custom
  light: monokai-custom
symbolPreset: nerd
statusLine:
  compactThinkingLevel: false
  preset: custom
  separator: powerline-thin
  contextLine: "off"
  leftSegments:
    - pi
    - hostname
    - model
    - mode
    - path
    - git
    - pr
    - subagents
  rightSegments:
    - session_name
    - context_pct
    - token_rate
    - time_spent
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 30
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
autocompleteMaxVisible: 20
defaultThinkingLevel: high
personality: pragmatic
providers:
  autoThinkingMaxEffort: xhigh
  openaiWebsockets: auto
  tinyModelDevice: default
  tinyModelDtype: default
tier:
  openai: priority
retry:
  enabled: true
  maxRetries: 4
  baseDelayMs: 500
  maxDelayMs: 30000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  # Try Codex, then Claude, then budget OpenRouter models (GLM followed by DeepSeek).
  # OpenRouter requests use API credits. Overlays replace chains wholesale.
  # All GLM fallbacks use max effort; other model families retain role-specific levels.
  fallbackChains:
    default:
      - openai-codex/gpt-6.1-sol:high
      - anthropic/claude-opus-5-5:medium
      - openrouter/z-ai/glm-5.3:max
      - openrouter/deepseek/deepseek-v4.1-flash:high
    smol:
      - openai-codex/gpt-6.1-sol:medium
      - anthropic/claude-sonnet-5-5:medium
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash:high
    slow:
      - openai-codex/gpt-6.1-sol:xhigh
      - anthropic/claude-opus-5-5:xhigh
      - openrouter/z-ai/glm-5.3:max
      - openrouter/deepseek/deepseek-v4.1-flash:max
    vision:
      - openai-codex/gpt-6.1-sol:high
      - anthropic/claude-opus-5-5:medium
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash:high
    plan:
      - openai-codex/gpt-6.1-sol:xhigh
      - anthropic/claude-opus-5-5:xhigh
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash:high
    commit:
      - openai-codex/gpt-6-sol:low
      - anthropic/claude-haiku-4-5:low
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash:low
    task:
      - openai-codex/gpt-6.1-sol:medium
      - anthropic/claude-sonnet-5-5:high
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash:high
    advisor:
      - openai-codex/gpt-6.1-sol:high
      - anthropic/claude-sonnet-5-5:high
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash:max
    spark:
      - anthropic/claude-sonnet-5-5:low
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash:high
    openrouter/~typesafe/jev-latest:
      - openrouter/~typesafe/jev-latest
dev:
  autoqaConsent: granted
display:
  hideToolActivity: false
memory:
  backend: local
archive:
  enabled: true
autolearn:
  enabled: true
  autoContinue: false
task:
  completionProbe: true
  speculativeLaunch: false
  agentModelOverrides:
    security-reviewer: "@advisor"
    sonic: "@spark"
  eager: preferred
  enableEffort: false
  showResolvedModelBadge: true
terminal:
  showImages: true
images:
  autoResize: true
  blockImages: false
hideThinkingBlock: true
composer:
  shape: box
  predictions: true
spelling:
  autocomplete: auto
browser:
  headless: true
computer:
  enabled: true
  display: active
power:
  sleepPrevention: system
tui:
  codexResetFireworks: true
codexResets:
  autoRedeem: "unset"
