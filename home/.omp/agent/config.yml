setupVersion: 3
modelRoles:
  # Opus implements, Fable plans, and Astra reviews; defaults remain overridable.
  default: anthropic/claude-fable-5-2:medium
  smol: openai-codex/gpt-6-luna:high
  spark: openai-codex/gpt-6-luna:medium
  slow: openai-codex/gpt-6.2-astra:xhigh
  vision: openai-codex/gpt-6.1-terra:medium
  image: openai/gpt-image-2.6-sunburst
  plan: anthropic/claude-fable-5-2:high
  commit: openai-codex/gpt-6-luna:medium
  task: anthropic/claude-opus-5-5:high
  # Deliberate primary: this Codex account offers Ultrafast for GPT-6.2 Sol.
  # Before proposing a replacement, verify its Ultrafast access and update the tier hook if needed.
  fast_task: openai-codex/gpt-6.2-sol:high
  advisor: openai-codex/gpt-6.2-astra:high
  tiny: local/lfm2.5-230m
  memory: openai-codex/gpt-6-luna
  judge: openrouter/~typesafe/jev-latest
  docs: anthropic/claude-fable-5-2:medium
  browser: openai-codex/gpt-6.1-terra:auto

  # Explicit model selection — available for deliberate per-call choices.
  deepseek: deploy/deepseek-ai/deepseek-v4.1-flash-1017:high
  astra: openai-codex/gpt-6.2-astra:medium
  sol: openai-codex/gpt-6.2-sol:high
  fable: anthropic/claude-fable-5-2:medium
  opus: anthropic/claude-opus-5-5:high
  # Special role: must point at a Codex model that offers the daybreak_blue
  # cyber access program on this account (gpt-6-sol and gpt-6-luna as of
  # 2026-11-18; gpt-6.2-sol/astra are standard-only). Do not bump it with the
  # other GPT roles without checking; see docs/agents.md, Daybreak section.
  daybreak: openai-codex/gpt-6-sol:max
systemPromptTemplates:
  openai-codex/gpt-6.2-sol: ~/.omp/agent/system-templates/gpt-6.2.md
  openai-codex/gpt-6.2-astra: ~/.omp/agent/system-templates/gpt-6.2.md
prewalk:
  # Opt in with /prewalk: plan on the current model, then hand off to @task.
  enabled: false
  # /prewalk restart uses this planning role; plain /prewalk keeps the current model.
  from: "@plan"
  into: "@task"
title:
  generator: tiny
  icons: nf+emoji
cycleOrder:
  - spark
  - smol
  - default
  - docs
  - daybreak
theme:
  dark: monokai-custom
  light: monokai-custom
symbolPreset: nerd
statusLine:
  compactThinkingLevel: false
  preset: custom
  separator: powerline-thin
  contextLine: "off"
  leftSegments:
    - pi
    - hostname
    - model
    - mode
    - path
    - git
    - pr
    - subagents
  rightSegments:
    - session_name
    - context_pct
    - token_rate
    - time_spent
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 30
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
autocompleteMaxVisible: 20
defaultThinkingLevel: high
personality: pragmatic
providers:
  # Try to deliver corrections while a supported Codex response is still streaming.
  # If rejected, OMP keeps the message for normal steering.
  openaiLiveSteering: true
  openai-codex:
    daybreak: true
  autoThinkingMaxEffort: xhigh
  openaiWebsockets: auto
  tinyModelDevice: default
  tinyModelDtype: default
tier:
  openai: priority
retry:
  enabled: true
  maxRetries: 4
  baseDelayMs: 500
  maxDelayMs: 30000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    image: []
    # Try direct Codex/Anthropic alternatives first, then Deploy DeepSeek,
    # OpenRouter GLM, and OpenRouter DeepSeek. OpenRouter uses API credits.
    default:
      - openai-codex/gpt-6.2-astra:high
      - deploy/deepseek-ai/deepseek-v4.1-flash-1017:high
      - openrouter/z-ai/glm-5.3:max
      - openrouter/deepseek/deepseek-v4.1-flash-1017:high
    smol:
      - openai-codex/gpt-6.1-terra:medium
      - anthropic/claude-fable-5-2:low
      - deploy/deepseek-ai/deepseek-v4.1-flash-1017:low
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash-1017:low
    slow:
      - anthropic/claude-fable-5-2:xhigh
      - deploy/deepseek-ai/deepseek-v4.1-flash-1017:max
      - openrouter/z-ai/glm-5.3:max
      - openrouter/deepseek/deepseek-v4.1-flash-1017:max
    vision:
      - openai-codex/gpt-6.2-astra:high
      - anthropic/claude-fable-5-2:medium
      - deploy/deepseek-ai/deepseek-v4.1-flash-1017:high
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash-1017:high
    plan:
      - openai-codex/gpt-6.2-astra:high
      - deploy/deepseek-ai/deepseek-v4.1-flash-1017:max
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash-1017:max
    commit:
      - anthropic/claude-fable-5-2:low
      - deploy/deepseek-ai/deepseek-v4.1-flash-1017:low
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash-1017:low
    task:
      - anthropic/claude-fable-5-2:high
      - deploy/deepseek-ai/deepseek-v4.1-flash-1017:high
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash-1017:high
    fast_task:
      - anthropic/claude-fable-5-2:medium
      - deploy/deepseek-ai/deepseek-v4.1-flash-1017:high
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash-1017:high
    advisor:
      - anthropic/claude-fable-5-2:high
      - deploy/deepseek-ai/deepseek-v4.1-flash-1017:max
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash-1017:max
    spark:
      - anthropic/claude-fable-5-2:low
      - deploy/deepseek-ai/deepseek-v4.1-flash-1017:low
      - openrouter/z-ai/glm-5.3-flash:max
      - openrouter/deepseek/deepseek-v4.1-flash-1017:low
    docs:
      - openai-codex/gpt-6.2-astra:medium
dev:
  autoqaConsent: granted
display:
  hideToolActivity: false
  subagentLivePreview: true
  showTokenUsage: true
  cacheMissMarker: true
  pinnedAgents: full
memory:
  backend: local
archive:
  enabled: true
autolearn:
  enabled: true
  autoContinue: false
task:
  perCallModel: "on"
  perCallModelAllow:
    - openai-codex/gpt-6.2-sol
    - openai-codex/gpt-6.2-astra
    - anthropic/claude-opus-5-5
    - anthropic/claude-fable-5-2
    - openai-codex/gpt-6.1-terra
    - openai-codex/gpt-6-luna
    # Daybreak (cyber access) model: agents may pick it per call when a
    # security assignment needs it; no agent definition is wired to it.
    - openai-codex/gpt-6-sol
    - deploy/deepseek-ai/deepseek-v4.1-flash-1017
  completionProbe: true
  speculativeLaunch: false
  agentModelOverrides:
    # Keep these specialists pinned; other agents use overridable role defaults.
    security-reviewer: "@advisor"
    sonic: "@spark"
  eager: preferred
  autoParallel: suggest
  enableEffort: false
  showResolvedModelBadge: true
  maxRecursionDepth: 2
terminal:
  showImages: true
images:
  autoResize: true
  blockImages: false
hideThinkingBlock: true
composer:
  shape: box
  predictions: true
  tokenRate: true
spelling:
  autocomplete: auto
browser:
  headless: true
computer:
  enabled: true
  display: active
power:
  sleepPrevention: system
tui:
  codexResetFireworks: true
  completeScrollback: true
  vimMode: false
codexResets:
  autoRedeem5h: unset
  autoRedeemWeekly: unset
generate_image:
  enabled: true
