providers:
  openai:
    baseUrl: https://api.openai.com/v1
    apiKey: OPENAI_API_KEY
    models:
      - id: gpt-image-2.6-sunburst
        name: GPT Image 2.6 Sunburst
        api: openai-images
        kind: image
        input: [text, image]

  openrouter:
    modelOverrides:
      openai/gpt-oss-120b:
        compat:
          openRouterRouting:
            # Prefer Cerebras while allowing other OpenRouter providers as fallbacks.
            order: [cerebras]

  deploy:
    baseUrl: https://api-cdn.deploy.com/api/v1
    api: openai-completions
    apiKey: HIVE_API_KEY
    authHeader: true
    headers:
      Accept: text/event-stream
    models:
      - id: deepseek-ai/deepseek-v4.1-flash-1017
        name: DeepSeek V4.1 Flash 1017 (Deploy)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 32768
        compat:
          maxTokensField: max_completion_tokens
          supportsReasoningEffort: true
          thinkingFormat: openai
          reasoningEffortMap:
            minimal: low
            low: low
            medium: high
            high: high
            xhigh: max
            max: max

  exaone:
    baseUrl: https://api.exaone.ai/v1
    api: openai-completions
    apiKey: EXAONE_API_KEY
    authHeader: true
    models:
      - id: k-exaone_v2.5
        name: K-EXAONE 2.5 (EXAONE)
        reasoning: true
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh, max]
          defaultLevel: high
          requiresEffort: true
        supportsTools: true
        input: [text]
        contextWindow: 524288
        maxTokens: 524288
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          supportsUsageInStreaming: true
          supportsStrictMode: false
          maxTokensField: max_tokens
          thinkingFormat: openai
          reasoningContentField: reasoning_content
          replayReasoningContent: true
          # The API reference lists low/high/max; the agent guide also mentions medium.
          reasoningEffortMap:
            minimal: low
            low: low
            medium: high
            high: high
            xhigh: max
            max: max
