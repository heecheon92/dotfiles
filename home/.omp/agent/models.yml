providers:
  openrouter:
    modelOverrides:
      openai/gpt-oss-120b:
        compat:
          openRouterRouting:
            # Prefer Cerebras while allowing other OpenRouter providers as fallbacks.
            order: [cerebras]

  hive:
    baseUrl: https://api-cdn.thehive.ai/api/v3
    api: openai-completions
    apiKey: HIVE_API_KEY
    authHeader: true
    headers:
      Accept: text/event-stream
    models:
      - id: deepseek-ai/deepseek-v4.1-flash-1017
        name: DeepSeek V4.1 Flash 1017 (Hive)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 32768
        compat:
          maxTokensField: max_completion_tokens
          supportsReasoningEffort: true
          thinkingFormat: openai
          reasoningEffortMap:
            minimal: low
            low: low
            medium: high
            high: high
            xhigh: max
            max: max
