setupVersion: 2
modelRoles:
  default: openai-codex/gpt-6-sol:medium
  smol: openai-codex/gpt-6-luna:high
  spark: openai-codex/gpt-6-luna:medium
  slow: openai-codex/gpt-6-astra:xhigh
  vision: openai-codex/gpt-6-sol:medium
  plan: openai-codex/gpt-6-astra:xhigh
  commit: openai-codex/gpt-6-luna:medium
  task: openai-codex/gpt-6-sol:high
  advisor: openai-codex/gpt-6-astra:high
  daybreak-blue: openai-codex/gpt-6-sol:max
  judge: openrouter/~typesafe/jev-latest
cycleOrder:
  - spark
  - smol
  - default
  - slow
  - daybreak-blue
theme:
  dark: monokai-custom
  light: monokai-custom
symbolPreset: nerd
statusLine:
  compactThinkingLevel: false
  preset: custom
  separator: powerline-thin
  contextLine: "off"
  leftSegments:
    - pi
    - hostname
    - model
    - mode
    - path
    - git
    - pr
    - subagents
  rightSegments:
    - session_name
    - context_pct
    - token_rate
    - time_spent
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 30
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
autocompleteMaxVisible: 20
defaultThinkingLevel: high
personality: pragmatic
providers:
  autoThinkingMaxEffort: xhigh
  openaiWebsockets: auto
  tinyModel: lfm2.5-230m
  tinyModelDevice: default
  tinyModelDtype: default
tier:
  openai: priority
retry:
  enabled: true
  maxRetries: 4
  baseDelayMs: 500
  maxDelayMs: 30000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  # Claude stays the last resort after the Codex alternates (see config.yml).
  fallbackChains:
    default:
      - openai-codex/gpt-6-sol:high
      - openai-codex/gpt-6-luna:high
      - anthropic/claude-opus-5-5:medium
    smol:
      - openai-codex/gpt-6-sol:low
      - openai-codex/gpt-6-luna:high
      - anthropic/claude-sonnet-5-5:medium
    slow:
      - openai-codex/gpt-6-sol:xhigh
      - openai-codex/gpt-6-luna:max
      - anthropic/claude-opus-5-5:xhigh
    vision:
      - openai-codex/gpt-6-sol:high
      - anthropic/claude-opus-5-5:medium
    plan:
      - openai-codex/gpt-6-sol:xhigh
      - anthropic/claude-opus-5-5:xhigh
    commit:
      - openai-codex/gpt-6-luna:low
      - anthropic/claude-haiku-4-5:low
    task:
      - openai-codex/gpt-6-luna:max
      - anthropic/claude-sonnet-5-5:high
    advisor:
      - openai-codex/gpt-6-sol:xhigh
      - anthropic/claude-sonnet-5-5:high
    spark:
      - openai-codex/gpt-6-luna:medium
      - anthropic/claude-sonnet-5-5:low
dev:
  autoqaConsent: granted
display:
  hideToolActivity: false
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: false
task:
  agentModelOverrides:
    security-reviewer: "@daybreak-blue, @advisor"
    sonic: "@spark"
  eager: preferred
  enableEffort: false
terminal:
  showImages: true
images:
  autoResize: true
  blockImages: false
hideThinkingBlock: true
composer:
  shape: box
browser:
  headless: true
power:
  sleepPrevention: system
