onboarding = false
[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "85%"
height = "80%"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "exec \"$HOME/.config/herdr/scripts/open-file-viewer-popup.sh\""
description = "open file viewer popup"
width = "90%"
height = "90%"

[theme]
name = "terminal"
auto_switch = false

[experimental]
kitty_graphics = true
