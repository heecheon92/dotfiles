onboarding = false
[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
[ui.toast]
delivery = "herdr"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec env ZDOTDIR=\"$HOME/.config/zsh/scratch\" zsh -l"
description = "open scratch terminal"
width = "85%"
height = "80%"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "edi.layout-tools.open-editor"
description = "layout editor"

[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "edi.layout-tools.equalize"
description = "equalize pane layouts"

# Terminal annotations
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Document review (plannotator-tui)
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[theme]
name = "terminal"
auto_switch = false

[experimental]
kitty_graphics = true

[ui.sound]
enabled = true
