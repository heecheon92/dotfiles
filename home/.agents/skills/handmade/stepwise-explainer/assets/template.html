<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepwise explainer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f6f4ef, #101012);
    --panel: light-dark(#ffffff, #1a1a1e);
    --inset: light-dark(#f1eee7, #0c0c0e);
    --ink: light-dark(#1d1c1a, #ece7dc);
    --muted: light-dark(#6b675f, #9a9488);
    --line: light-dark(#d9d4c8, #34343a);
    --accent: light-dark(#8a5a00, #e0a84a);
    --accent-ink: light-dark(#ffffff, #101012);
    --warn: light-dark(#c98a00, #e6c84f);
    --good: light-dark(#2f7d4f, #62c98a);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 72rem; margin: 0 auto; padding: 2rem 1rem 3rem; display: grid; gap: 1.5rem; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); line-height: 1.15; margin: .3rem 0 .6rem; }
  h2 { font-size: 1.15rem; margin: 0; }
  h3 { font-size: 1rem; margin: 0; }
  p { margin: 0; overflow-wrap: anywhere; }
  code { font: .88em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--inset); padding: .08em .3em; border-radius: .3em; }
  .eyebrow { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .lede { max-width: 48rem; color: var(--muted); }
  .lede b { color: var(--ink); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem; min-width: 0; }
  .stack { display: grid; gap: .6rem; }
  .tabs { display: inline-flex; gap: .25rem; padding: .25rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: fit-content; flex-wrap: wrap; }
  .tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; padding: .4rem .8rem; border-radius: 9px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .layout { display: grid; gap: 1.5rem; align-items: start; }
  @media (min-width: 62rem) { .layout { grid-template-columns: 3fr 2fr; } }
  .side { display: grid; gap: 1rem; min-width: 0; }
  .scroll { overflow-x: auto; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .7rem; margin-top: .8rem; }
  .btn { font: inherit; font-size: .9rem; padding: .4rem .8rem; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn:disabled { opacity: .4; cursor: default; }
  .hint { font-size: .78rem; color: var(--muted); }
  .route { display: inline-block; width: fit-content; font-size: .8rem; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: .1rem .6rem; }
  .cap { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: .3rem; }
  pre { margin: 0; background: var(--inset); border-radius: 10px; padding: .75rem; font: .78rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bucket + .bucket { border-top: 1px solid var(--line); padding-top: .8rem; margin-top: .3rem; }
  .bucket ul { list-style: none; margin: .5rem 0 0; padding: 0; display: grid; gap: .45rem; font-size: .9rem; }
  .bucket li { display: flex; align-items: center; gap: .5rem; }
  .bucket li span { flex: 0 0 50%; }
  .bucket li.empty { color: var(--muted); }
  .track { flex: 1; }
  .bar { height: .55rem; border-radius: 999px; background: var(--muted); opacity: .75; }
  .bar.warn { background: var(--warn); opacity: 1; }
  .bar.good { background: var(--good); opacity: 1; }
  .tag { font-size: .72rem; font-weight: 600; color: var(--good); margin-left: .4rem; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: .6rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  tr:last-child > * { border-bottom: 0; }
  thead th { color: var(--muted); font-weight: 600; }
  footer { font-size: .78rem; color: var(--muted); display: grid; gap: .25rem; }
  .sim { font-size: .78rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: .3rem .6rem; width: fit-content; margin-top: .7rem; }
  [hidden] { display: none !important; }

  #diagram { display: block; width: 100%; height: auto; }
  #diagram text { font-family: ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
  .lane-box { fill: var(--inset); stroke: var(--line); }
  .lane-line { stroke: var(--line); stroke-dasharray: 4 5; }
  .lane-off { opacity: .35; }
  .lane-sub { opacity: .65; }
  g.step { color: var(--ink); cursor: pointer; transition: opacity .2s; }
  g.step.future { opacity: .14; }
  g.step.past { opacity: .6; }
  g.step.current { color: var(--accent); }
  g.step .lbl { paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round; }
  g.step .selfbox { fill: var(--panel); stroke: currentColor; }
  g.step.current .selfbox { fill: color-mix(in oklab, var(--accent) 16%, var(--panel)); }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <section class="layout">
    <div class="panel" id="diagram-card">
      <div class="scroll"><svg id="diagram" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sequence of steps between the actors"></svg></div>
      <div class="controls">
        <button class="btn" id="prev">← Back</button>
        <button class="btn primary" id="next">Next step →</button>
        <span id="counter"></span>
        <span class="hint">Arrow keys work too. Click any step to jump.</span>
      </div>
    </div>

    <div class="side">
      <div class="panel stack" id="step-card">
        <span class="route" id="step-route"></span>
        <h2 id="step-title"></h2>
        <p id="step-body"></p>
        <div id="payload-wrap" class="stack">
          <p class="cap" id="payload-cap"></p>
          <pre id="payload"></pre>
        </div>
      </div>
      <div class="panel stack" id="state-card">
        <div id="buckets" class="stack"></div>
        <p class="hint" id="state-note"></p>
      </div>
    </div>
  </section>

  <section class="panel stack" id="summary" hidden>
    <h2 id="summary-title"></h2>
    <div class="scroll"><table id="summary-table"></table></div>
    <p id="summary-note"></p>
  </section>

  <footer id="notes"></footer>
</main>

<script id="explainer-data">
const EXPLAINER = {
  eyebrow: "Tool calling, one message at a time",
  title: "Who asks for the tool, and who reads the result?",
  // The single concrete scenario used by every flow.
  lede: "Same question in both flows: **“Which is warmest: Seoul, Tokyo or Busan?”** with one tool, `get_weather`. Step through each flow and watch the panel on the right: it shows the message being sent and what the model has read so far.",
  simulation: "Simulation: messages are hand-written and abbreviated, not captured from a real run.",

  // Actors, left to right. Keep them fixed across flows.
  lanes: [
    { id: "user",  name: "User",     sub: "asks the question" },
    { id: "app",   name: "Your app", sub: "agent runtime" },
    { id: "model", name: "Model",    sub: "LLM API" },
    { id: "box",   name: "Sandbox",  sub: "runs the script" },
  ],

  // First flow = what the reader already knows. Later flows = the new idea.
  flows: [
    {
      id: "basic",
      tab: "Basic tool calling",
      unused: ["box"],
      buckets: [{ id: "model", title: "What the model has read so far" }],
      steps: [
        { from: "user", to: "app", label: "question", title: "The user asks",
          body: "Nothing special yet. Your app receives the question.",
          cap: "User message", payload: `"Which is warmest: Seoul, Tokyo or Busan?"` },
        { from: "app", to: "model", label: "question + tool list", title: "Your app calls the model",
          body: "The request carries the conversation and a description of every tool the model may ask for.",
          cap: "Request to the model",
          payload: `{
  "messages": [{ "role": "user", "content": "Which is warmest: ..." }],
  "tools": [{ "name": "get_weather", "input_schema": { "city": "string" } }]
}`,
          adds: { model: [{ label: "User question", size: 1 }, { label: "Tool description: get_weather", size: 1 }] } },
        { from: "model", to: "app", label: "3 × tool_use", title: "The model asks for the tool",
          body: "The model cannot run anything. It stops and returns three requests, one per city.",
          cap: "Model response",
          payload: `{
  "stop_reason": "tool_use",
  "content": [
    { "type": "tool_use", "id": "toolu_1", "name": "get_weather", "input": { "city": "Seoul" } },
    { "type": "tool_use", "id": "toolu_2", "name": "get_weather", "input": { "city": "Tokyo" } },
    { "type": "tool_use", "id": "toolu_3", "name": "get_weather", "input": { "city": "Busan" } }
  ]
}`,
          adds: { model: [{ label: "Its own 3 tool requests", size: 1 }] } },
        { self: "app", label: "run get_weather × 3", title: "Your app runs the tool",
          body: "Your code calls the real weather function three times, on your machine.",
          cap: "Inside your app",
          payload: `get_weather("Seoul")  ->  {"temp": 9,  "humidity": 40, "wind": ...}
get_weather("Tokyo")  ->  {"temp": 14, "humidity": 55, "wind": ...}
get_weather("Busan")  ->  {"temp": 12, "humidity": 61, "wind": ...}` },
        { from: "app", to: "model", label: "3 × tool_result", title: "Results go back to the model",
          body: "This is the costly step. All three full results are appended to the conversation, so the model reads every field of every result.",
          cap: "Request to the model",
          payload: `{ "role": "user", "content": [
  { "type": "tool_result", "tool_use_id": "toolu_1", "content": "{\\"temp\\": 9, \\"humidity\\": 40, ...}" },
  { "type": "tool_result", "tool_use_id": "toolu_2", "content": "{\\"temp\\": 14, ...}" },
  { "type": "tool_result", "tool_use_id": "toolu_3", "content": "{\\"temp\\": 12, ...}" }
] }`,
          adds: { model: [
            { label: "Full result: Seoul", size: 5, tone: "warn" },
            { label: "Full result: Tokyo", size: 5, tone: "warn" },
            { label: "Full result: Busan", size: 5, tone: "warn" }] } },
        { from: "model", to: "app", label: "text answer", title: "The model compares and answers",
          body: "The model itself does the comparing, by reading the three results.",
          cap: "Model response",
          payload: `{
  "stop_reason": "end_turn",
  "content": [{ "type": "text", "text": "Tokyo is warmest at 14°C." }]
}` },
        { from: "app", to: "user", label: "answer", title: "The user gets the answer",
          body: "Done. Look at the panel below: the model read every full tool result to get here.",
          cap: "Shown to the user", payload: `Tokyo is warmest at 14°C.` },
      ],
    },
    {
      id: "ptc",
      tab: "Programmatic tool calling",
      buckets: [
        { id: "model", title: "What the model has read so far" },
        { id: "box", title: "Held in the sandbox only", tag: "model never reads this" },
      ],
      steps: [
        { from: "user", to: "app", label: "question", title: "The user asks",
          body: "Same start as the basic flow.",
          cap: "User message", payload: `"Which is warmest: Seoul, Tokyo or Busan?"` },
        { from: "app", to: "model", label: "question + tool list", title: "Your app calls the model",
          body: "Two changes in the tool list: a code execution tool is added, and `get_weather` is marked as callable from code.",
          cap: "Request to the model",
          payload: `{
  "messages": [{ "role": "user", "content": "Which is warmest: ..." }],
  "tools": [
    { "type": "code_execution_20260120", "name": "code_execution" },
    { "name": "get_weather", "input_schema": { "city": "string" },
      "allowed_callers": ["code_execution_20260120"] }
  ]
}`,
          adds: { model: [{ label: "User question", size: 1 }, { label: "Tool descriptions: code_execution, get_weather", size: 1 }] } },
        { from: "model", to: "box", label: "a script", title: "The model writes a script",
          body: "Instead of asking for `get_weather` directly, the model writes code that calls it. Inside the sandbox, `get_weather` is just a function. The sandbox starts running the script.",
          cap: "Script the model wrote (a server_tool_use block)",
          payload: `import json, asyncio

cities = ["Seoul", "Tokyo", "Busan"]
res = await asyncio.gather(
    *[get_weather({"city": c}) for c in cities])
temps = {c: json.loads(r)["temp"] for c, r in zip(cities, res)}
print(max(temps, key=temps.get), temps)`,
          adds: { model: [{ label: "Its own script", size: 2 }] } },
        { from: "box", to: "app", label: "3 × tool_use (caller: script)", title: "The script asks for the tool, then pauses",
          body: "The script reaches `get_weather(...)`. The sandbox cannot run your function, so it pauses and your app receives the same `tool_use` blocks as before, with one new field: `caller`. It says the script asked, not the model.",
          cap: "Response your app receives",
          payload: `{
  "stop_reason": "tool_use",
  "container": { "id": "container_xyz" },
  "content": [
    { "type": "tool_use", "id": "toolu_1", "name": "get_weather",
      "input": { "city": "Seoul" },
      "caller": { "type": "code_execution_20260120", "tool_id": "srvtoolu_A" } },
    ... same for Tokyo and Busan
  ]
}` },
        { self: "app", label: "run get_weather × 3", title: "Your app runs the tool",
          body: "Identical to the basic flow. Your code, your machine, three real calls.",
          cap: "Inside your app",
          payload: `get_weather("Seoul")  ->  {"temp": 9,  "humidity": 40, "wind": ...}
get_weather("Tokyo")  ->  {"temp": 14, "humidity": 55, "wind": ...}
get_weather("Busan")  ->  {"temp": 12, "humidity": 61, "wind": ...}` },
        { from: "app", to: "box", label: "3 × tool_result", title: "Results go to the script, not the model",
          body: "This is the whole point. You send the same `tool_result` blocks, plus the container ID so the paused script can be found. Each result becomes the return value of `get_weather(...)` inside the script. The model does not read them.",
          cap: "Request your app sends",
          payload: `{
  "container": "container_xyz",
  "messages": [ ..., { "role": "user", "content": [
    { "type": "tool_result", "tool_use_id": "toolu_1", "content": "{\\"temp\\": 9, \\"humidity\\": 40, ...}" },
    { "type": "tool_result", "tool_use_id": "toolu_2", "content": "{\\"temp\\": 14, ...}" },
    { "type": "tool_result", "tool_use_id": "toolu_3", "content": "{\\"temp\\": 12, ...}" }
  ] } ]
}`,
          adds: { box: [
            { label: "Full result: Seoul", size: 5, tone: "good" },
            { label: "Full result: Tokyo", size: 5, tone: "good" },
            { label: "Full result: Busan", size: 5, tone: "good" }] } },
        { self: "box", label: "script finishes", title: "The script resumes and does the comparing",
          body: "The script picks out the temperatures, finds the maximum and prints one line. This is ordinary code running, with no model involved.",
          cap: "What the script printed (stdout)", payload: `Tokyo {'Seoul': 9, 'Tokyo': 14, 'Busan': 12}` },
        { from: "box", to: "model", label: "printed output only", title: "Only the printed line reaches the model",
          body: "The model receives the script's output, one short line, instead of three full results.",
          cap: "Block added to the model's context",
          payload: `{ "type": "code_execution_tool_result", "tool_use_id": "srvtoolu_A",
  "content": { "stdout": "Tokyo {'Seoul': 9, 'Tokyo': 14, 'Busan': 12}" } }`,
          adds: { model: [{ label: "Script output: 1 line", size: 1, tone: "good" }] } },
        { from: "model", to: "app", label: "text answer", title: "The model answers",
          body: "The model turns the one line into a sentence.",
          cap: "Model response",
          payload: `{
  "stop_reason": "end_turn",
  "content": [{ "type": "text", "text": "Tokyo is warmest at 14°C." }]
}` },
        { from: "app", to: "user", label: "answer", title: "The user gets the answer",
          body: "Same answer. Compare the panel below with the basic flow: the full results never entered the model's context.",
          cap: "Shown to the user", payload: `Tokyo is warmest at 14°C.` },
      ],
    },
  ],

  stateNote: "Bar lengths are illustrative, not measured token counts.",

  // Optional. Remove to hide the section.
  summary: {
    title: "The difference, side by side",
    columns: ["", "Basic", "Programmatic (PTC)"],
    rows: [
      ["What the model emits", "`tool_use` requests", "A script (`server_tool_use`)"],
      ["Who issues each tool request", "The model", "The running script (see the `caller` field)"],
      ["Who executes `get_weather`", "Your app", "Your app (unchanged)"],
      ["Where the tool result goes", "Into the model's context", "Into a variable in the script"],
      ["What the model reads", "Every full result", "Only what the script prints"],
    ],
    note: "With three cities the saving is small. With 200 cities, or results of thousands of rows each, the basic flow makes the model read all of it, while the PTC flow still ends with one printed line.",
  },

  // Optional footnotes: limits, approximations, sources.
  notes: [
    "Message shapes follow Anthropic's Messages API. There the sandbox is a container hosted by Anthropic, so steps drawn between the sandbox and your app physically travel inside API responses and requests.",
    "The fields of the final `code_execution_tool_result` block are approximate.",
  ],
};
</script>

<script>
(() => {
  const D = EXPLAINER, NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const GAP = 160, EDGE = 80, TOP = 96, ROW = 48;
  const W = EDGE * 2 + GAP * (D.lanes.length - 1);
  const X = Object.fromEntries(D.lanes.map((l, i) => [l.id, EDGE + i * GAP]));
  const NAME = Object.fromEntries(D.lanes.map((l) => [l.id, l.name]));
  let flowIx = 0, cur = 0;

  // Text with `code` and **bold** spans, built from DOM nodes (no innerHTML).
  function rich(node, text) {
    node.replaceChildren();
    for (const part of String(text ?? "").split(/(`[^`]+`|\*\*[^*]+\*\*)/)) {
      if (!part) continue;
      if (part.startsWith("`")) node.append(Object.assign(document.createElement("code"), { textContent: part.slice(1, -1) }));
      else if (part.startsWith("**")) node.append(Object.assign(document.createElement("b"), { textContent: part.slice(2, -2) }));
      else node.append(part);
    }
  }
  const plain = (t) => String(t ?? "").replace(/`|\*\*/g, "");
  function svgEl(name, attrs, parent, text) {
    const n = document.createElementNS(NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    parent?.appendChild(n);
    return n;
  }

  function draw() {
    const flow = D.flows[flowIx], svg = $("diagram");
    const H = TOP + flow.steps.length * ROW + 10;
    svg.replaceChildren();
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.style.minWidth = `${Math.min(W, 520)}px`;
    for (const lane of D.lanes) {
      const off = (flow.unused || []).includes(lane.id);
      const g = svgEl("g", { id: `lane-${lane.id}`, class: off ? "lane-off" : "" }, svg);
      svgEl("title", {}, g, `${lane.name}: ${off ? "not used in this flow" : lane.sub || ""}`);
      svgEl("line", { class: "lane-line", x1: X[lane.id], x2: X[lane.id], y1: 56, y2: H - 6 }, g);
      svgEl("rect", { class: "lane-box", x: X[lane.id] - 66, y: 8, width: 132, height: 48, rx: 10 }, g);
      svgEl("text", { x: X[lane.id], y: 29, "text-anchor": "middle", "font-size": 15, "font-weight": 700 }, g, lane.name);
      svgEl("text", { class: "lane-sub", x: X[lane.id], y: 46, "text-anchor": "middle", "font-size": 11 }, g, off ? "not used here" : lane.sub || "");
    }
    flow.steps.forEach((s, i) => {
      const y = TOP + i * ROW;
      const state = i < cur ? "past" : i === cur ? "current" : "future";
      const g = svgEl("g", { id: `${flow.id}-step-${i + 1}`, class: `step ${state}` }, svg);
      svgEl("title", {}, g, `Step ${i + 1}: ${plain(s.title)}`);
      svgEl("rect", { x: 0, y: y - ROW / 2, width: W, height: ROW, fill: "transparent" }, g);
      svgEl("text", { x: 10, y: y + 4, "font-size": 12, "font-weight": 700 }, g, String(i + 1));
      if (s.self) {
        const w = Math.max(118, s.label.length * 7.2 + 20);
        svgEl("rect", { class: "selfbox", x: X[s.self] - w / 2, y: y - 14, width: w, height: 28, rx: 14, "stroke-width": 1.6 }, g);
        svgEl("text", { x: X[s.self], y: y + 4, "text-anchor": "middle", "font-size": 12.5 }, g, s.label);
      } else {
        const a = X[s.from], b = X[s.to], dir = b > a ? 1 : -1;
        svgEl("line", { x1: a + 4 * dir, x2: b - 10 * dir, y1: y + 8, y2: y + 8, stroke: "currentColor", "stroke-width": 2 }, g);
        svgEl("path", { d: `M ${b - 2 * dir} ${y + 8} l ${-11 * dir} -5.5 v 11 z`, fill: "currentColor" }, g);
        svgEl("circle", { cx: a, cy: y + 8, r: 3.5, fill: "currentColor" }, g);
        svgEl("text", { class: "lbl", x: (a + b) / 2, y: y - 1, "text-anchor": "middle", "font-size": 12.5 }, g, s.label);
      }
      g.addEventListener("click", () => { cur = i; render(); });
    });
  }

  function drawBuckets() {
    const flow = D.flows[flowIx], seen = flow.steps.slice(0, cur + 1), wrap = $("buckets");
    wrap.replaceChildren();
    $("state-card").hidden = !(flow.buckets || []).length;
    for (const b of flow.buckets || []) {
      const box = document.createElement("div"); box.className = "bucket"; box.id = `bucket-${b.id}`;
      const h = document.createElement("h3"); h.textContent = b.title;
      if (b.tag) h.append(Object.assign(document.createElement("span"), { className: "tag", textContent: b.tag }));
      const ul = document.createElement("ul");
      const items = seen.flatMap((s) => (s.adds && s.adds[b.id]) || []);
      if (!items.length) ul.append(Object.assign(document.createElement("li"), { className: "empty", textContent: "Nothing yet." }));
      for (const it of items) {
        const li = document.createElement("li");
        const bar = Object.assign(document.createElement("div"), { className: `bar ${it.tone || ""}` });
        bar.style.width = `${Math.min(5, it.size || 1) * 20}%`;
        const track = Object.assign(document.createElement("div"), { className: "track" });
        track.append(bar);
        li.append(Object.assign(document.createElement("span"), { textContent: it.label }), track);
        ul.append(li);
      }
      box.append(h, ul); wrap.append(box);
    }
  }

  function render() {
    const flow = D.flows[flowIx], s = flow.steps[cur];
    draw(); drawBuckets();
    document.querySelectorAll("#tabs button").forEach((t, i) => t.setAttribute("aria-selected", i === flowIx));
    $("step-route").textContent = s.self ? `Inside: ${NAME[s.self]}` : `${NAME[s.from]} → ${NAME[s.to]}`;
    rich($("step-title"), `${cur + 1}. ${s.title}`);
    rich($("step-body"), s.body);
    $("payload-wrap").hidden = !s.payload;
    $("payload-cap").textContent = s.cap || "";
    $("payload").textContent = s.payload || "";
    $("counter").textContent = `Step ${cur + 1} of ${flow.steps.length}`;
    $("prev").disabled = cur === 0;
    const last = cur === flow.steps.length - 1, nextFlow = D.flows[flowIx + 1];
    $("next").textContent = !last ? "Next step →" : nextFlow ? `Now see: ${nextFlow.tab} →` : "Start over";
  }

  function next() {
    if (cur < D.flows[flowIx].steps.length - 1) cur++;
    else { flowIx = flowIx + 1 < D.flows.length ? flowIx + 1 : flowIx; cur = 0; }
    render();
  }
  function prev() { if (cur > 0) { cur--; render(); } }

  // Static parts.
  document.title = plain(D.title);
  $("eyebrow").textContent = D.eyebrow || "";
  rich($("title"), D.title);
  rich($("lede"), D.lede);
  if (D.simulation) $("lede").after(Object.assign(document.createElement("p"), { className: "sim", textContent: D.simulation }));
  $("state-note").textContent = D.stateNote || "";
  $("tabs").hidden = D.flows.length < 2;
  D.flows.forEach((f, i) => {
    const b = Object.assign(document.createElement("button"), { textContent: f.tab, id: `tab-${f.id}` });
    b.setAttribute("role", "tab");
    b.addEventListener("click", () => { flowIx = i; cur = 0; render(); });
    $("tabs").append(b);
  });
  if (D.summary) {
    $("summary").hidden = false;
    $("summary-title").textContent = D.summary.title || "";
    rich($("summary-note"), D.summary.note);
    const head = document.createElement("thead"), hr = document.createElement("tr"), body = document.createElement("tbody");
    for (const c of D.summary.columns) hr.append(Object.assign(document.createElement("th"), { textContent: c }));
    head.append(hr);
    for (const row of D.summary.rows) {
      const tr = document.createElement("tr");
      row.forEach((cell, i) => { const c = document.createElement(i ? "td" : "th"); rich(c, cell); tr.append(c); });
      body.append(tr);
    }
    $("summary-table").append(head, body);
  }
  for (const n of D.notes || []) { const p = document.createElement("p"); rich(p, n); $("notes").append(p); }

  $("next").addEventListener("click", next);
  $("prev").addEventListener("click", prev);
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
  });
  render();
})();
</script>
</body>
</html>
