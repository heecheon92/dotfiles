* { box-sizing: border-box; }

/* .dio-main holds one view (a walkthrough, the collection home, a message). It is the size

   single page and beside the collection map. */
.dio-main { container: dio / inline-size; min-width: 0; }
.page { margin: 0 auto; padding: 18px 24px 24px; }

/* Header */
.wt-head { display: flex; gap: 24px; align-items: flex-end; justify-content: space-between; margin: 0 4px 16px; }
.wt-head h1 { font-size: 25px; line-height: 1.2; margin: 0 0 4px; font-weight: 800; letter-spacing: -0.02em; }
.crumb { margin: 0 0 2px; font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.question { margin: 2px 0 6px; font-size: 15.5px; line-height: 1.45; font-weight: 700; color: var(--ink); max-width: 90ch; }
.summary { margin: 0; color: var(--ink-2); max-width: 100ch; }
.note { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
.pills { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0 0 4px; flex-shrink: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; line-height: 1.5; padding: 2px 11px; border: 1.3px solid var(--ink); border-radius: 999px; background: var(--tb, var(--paper-b)); color: var(--tf, var(--ink)); box-shadow: 0 2px 0 var(--drop); white-space: nowrap; }
.pill .ic { width: 13px; height: 13px; }

/* Layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto 1fr; grid-template-areas: "stage explain" "strip explain"; gap: 18px; align-items: start; }
.card { background: var(--card); border: 1.3px solid var(--ink); border-radius: 16px; box-shadow: 0 3px 0 var(--drop); }
.stage { grid-area: stage; padding: 12px 12px 10px; min-width: 0; }
.explain { grid-area: explain; padding: 18px 20px 16px; min-width: 0; position: relative; }
.strip { grid-area: strip; padding: 12px 16px 8px; min-width: 0; }
@container dio (max-width: 1099px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "stage" "explain" "strip"; }
}
/* Desktop: an app shell that fills the window. The stage takes all spare room and the explanation scrolls inside its card. */
@media (min-width: 1100px) and (min-height: 640px) {
  html, body { height: 100%; }
  body { overflow: hidden; }
  .dio-main { height: 100dvh; overflow-y: auto; }
  @container dio (min-width: 1100px) {
    .page { height: 100%; display: flex; flex-direction: column; padding: 16px 20px 20px; }
    .wt-head { flex-shrink: 0; margin-bottom: 12px; }
    .layout { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr) clamp(360px, 26cqw, 460px); grid-template-rows: minmax(0, 1fr) auto; align-items: stretch; gap: 16px; }
    .stage { display: flex; flex-direction: column; min-height: 0; }
    .scene-wrap { flex: 1; min-height: 0; }
    .scene-wrap .scene { position: absolute; inset: 0; height: 100%; }
    .explain { min-height: 0; overflow-y: auto; }
  }
}

/* Buttons */
.btn { font: 700 13px/1.2 var(--mono); padding: 8px 13px; border-radius: 10px; border: 1.3px solid var(--ink); background: var(--card); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; box-shadow: 0 2.5px 0 var(--drop); transition: transform .08s, box-shadow .08s, background .15s; }

/* Stage */
.stage-top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 2px 2px 10px; }
.metrics { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 auto; min-width: 0; }
.chip { --cs: 0 0 0 transparent; min-width: 108px; padding: 5px 11px 6px; border: 1.2px solid var(--line); border-radius: 11px; background: var(--card); box-shadow: var(--cs); }
.chip-l { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); white-space: nowrap; line-height: 1.35; }
.chip-l .ic { width: 12px; height: 12px; }
.chip-v { display: block; font-size: 16px; font-weight: 800; line-height: 1.35; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip-u { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.chip.total { --cs: 0 2px 0 var(--drop); border-color: var(--ink); background: var(--amber-b); }
.chip.total .chip-l, .chip.total .chip-u { color: var(--amber-f); }
.chip.flash { animation: chip-flash 1.5s ease-out; }
.chip-v.swap { animation: value-in .42s cubic-bezier(.2, .7, .2, 1); }
@keyframes chip-flash {
  0% { box-shadow: var(--cs), 0 0 0 0 rgba(127, 194, 120, .7); transform: translateY(0); }
  12% { box-shadow: var(--cs), 0 0 0 4px rgba(127, 194, 120, .55); transform: translateY(-2px); }
  30% { transform: translateY(0); }
  100% { box-shadow: var(--cs), 0 0 0 10px rgba(127, 194, 120, 0); }
}
@keyframes value-in { from { opacity: 0; transform: translateY(4px); } }
.stage-controls { display: flex; gap: 8px; flex-shrink: 0; padding-top: 4px; }

.scene-wrap { position: relative; border-radius: 12px; background: var(--stage); border: 1px solid var(--line); overflow: hidden; }
.scene { display: block; width: 100%; height: clamp(340px, calc(100vh - 392px), 760px); user-select: none; -webkit-user-select: none; }
.scroll-hint { margin: 6px 4px 0; font-size: 11.5px; color: var(--muted); }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 8px 4px 0; padding: 0; font-size: 11.5px; color: var(--muted); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 16px; height: 16px; overflow: visible; }
.panel-inline { margin: 10px 2px 0; padding: 10px 12px; border: 1.3px solid var(--ink); border-radius: 10px; background: var(--card); box-shadow: 0 2.5px 0 var(--drop); font-size: 12px; }
.panel-inline.swap { animation: value-in .42s cubic-bezier(.2, .7, .2, 1); }
.panel-inline .pi-title { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 4px; }

.st text { font-family: var(--mono); }

.st.paused * { animation-play-state: paused !important; }

.hud-drop { fill: var(--drop); }
.hud-bg { fill: var(--card); stroke: var(--ink); stroke-width: 1.4; }
.hud-title { fill: var(--muted); font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; }
.hud-rule { stroke: var(--line); stroke-width: 1; }
.hud-rule.sum { stroke: var(--ink); stroke-opacity: .5; stroke-dasharray: 3 3; }
.hud-line { font-size: 12px; font-weight: 600; fill: var(--ink-2); white-space: pre; }
.hud-line.sum { fill: var(--green-f); font-weight: 800; }
.hud-line.bad { fill: var(--red-f); font-weight: 700; }
.hud-line.note { fill: var(--muted); font-size: 11px; font-style: italic; white-space: normal; }
.hud-band.sum { fill: var(--green-b); }
.hud-band.bad { fill: var(--red-b); }
.hud-ic { stroke: var(--red-f); }

/* Explanation */
.guide { position: relative; }
.guide .blk { animation: guide-in .36s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(130ms + var(--i, 0) * 30ms); }
.guide.still .blk { animation: none; }
@keyframes guide-in { from { opacity: 0; transform: translateX(var(--slide, 0)); } }
.guide-old { position: absolute; pointer-events: none; animation: guide-out .15s ease forwards; }
@keyframes guide-out { to { opacity: 0; } }
.guide-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; font-weight: 800; line-height: 1.5; padding: 1px 10px; border-radius: 999px; background: var(--tb); color: var(--tf); border: 1.3px solid var(--ink); box-shadow: 0 2px 0 var(--drop); }
.guide h2 { font-size: 19px; line-height: 1.3; margin: 10px 0 8px; font-weight: 800; letter-spacing: -0.01em; }
.body p { margin: 0 0 10px; color: var(--ink-2); }
.body b { color: var(--ink); }
.body code { font: 12.5px var(--mono); background: var(--card-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.body .term { font-weight: 700; color: var(--ink); background: linear-gradient(transparent 60%, var(--amber-b) 60%); }
.body .takeaways { list-style: none; margin: 0 0 10px; padding: 0; }
.body .takeaways li { position: relative; padding-left: 22px; margin: 5px 0; color: var(--ink-2); }
.body .takeaways li::before { content: ""; position: absolute; left: 5px; top: .62em; width: 7px; height: 7px; border-radius: 1.5px; background: var(--ink); transform: rotate(45deg); }
.callout { display: flex; gap: 10px; padding: 10px 12px; margin: 12px 0; border-radius: 12px; background: var(--tb); border: 1.2px solid var(--line); color: var(--ink); }
.callout-icon { flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; border: 1.3px solid var(--tf); color: var(--tf); }
.callout-icon .ic { width: 16px; height: 16px; }
.callout strong { display: block; font-size: 11px; color: var(--tf); letter-spacing: .04em; }
.callout p { margin: 0; font-size: 12.5px; line-height: 1.6; }
.section-h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 6px; font-weight: 800; }
.changes ul, .goals ul { list-style: none; margin: 0; padding: 0; }
.changes li { display: flex; gap: 9px; align-items: baseline; margin: 4px 0; font-size: 12.5px; }
.mark { flex-shrink: 0; width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 800; line-height: 1; background: var(--tb); color: var(--tf); border: 1.2px solid var(--tf); transform: translateY(3px); }

/* Try it: options the reader picks on a try step, and the verdict on the one picked */
.try { margin: 14px 0 4px; padding: 11px 12px 12px; border: 1.3px dashed var(--ink); border-radius: 12px; background: var(--card-2); }
.try .section-h { margin: 0 0 4px; }
.try-prompt { margin: 0 0 10px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
.try-options { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.try-opt { padding: 6px 11px; font-size: 12.5px; }
.try-opt kbd { padding: 0 4px; }
.try-opt[aria-pressed="true"] { background: var(--amber-b); transform: translateY(2px); box-shadow: 0 .5px 0 var(--drop); }
.try-opt[aria-pressed="true"]:hover:not(:disabled) { background: var(--amber-b); }
.try-reset { margin-left: auto; }
.try-verdict { margin-top: 10px; padding: 9px 12px 10px; border: 1.3px solid var(--ink); border-radius: 10px; background: var(--tb); color: var(--tf); box-shadow: 0 2.5px 0 var(--drop); animation: verdict-in .36s cubic-bezier(.2, .7, .2, 1); }
.try-v-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin: 0; }
.try-v-text { font-size: 14px; font-weight: 800; }
.try-v-opt { font-size: 11px; font-weight: 700; white-space: nowrap; }
.try-v-why { margin: 3px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--ink); }
@keyframes verdict-in { from { opacity: 0; transform: translateY(4px); } }

/* Sources: where the facts and numbers come from */
.sources { border-top: 1px solid var(--line); margin-top: 16px; }
.sources summary { cursor: pointer; margin: 12px 0 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
.sources-h { text-transform: uppercase; }
.sources summary .tag { letter-spacing: 0; }
.sources ul { list-style: none; margin: 0; padding: 0; }
.sources li { display: flex; gap: 9px; align-items: flex-start; margin: 8px 0; font-size: 12px; line-height: 1.5; }
.sources li .tag { flex-shrink: 0; margin-top: 2px; }
.src-claim { margin: 0; color: var(--ink); }
.src-from { margin: 1px 0 0; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.src-from a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }

.nav { display: flex; gap: 10px; margin-top: 18px; }
.nav .primary { flex: 1 1 auto; min-width: 0; justify-content: space-between; }
.nav .primary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kbd-hint { margin: 10px 0 0; font-size: 11px; color: var(--muted); text-align: center; }
.kbd-hint span { white-space: nowrap; }
kbd { font: 10.5px var(--mono); padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--card-2); color: var(--ink-2); }

.goals { border-top: 1px solid var(--line); margin-top: 16px; }
.goals li { display: flex; gap: 9px; align-items: flex-start; margin: 6px 0; font-size: 12.5px; color: var(--muted); }
.check { flex-shrink: 0; width: 17px; height: 17px; margin-top: 2px; border-radius: 4px; border: 1.3px solid var(--muted); display: grid; place-items: center; transition: background .25s, border-color .25s; }
.check .ic { width: 12px; height: 12px; opacity: 0; color: var(--green-f); stroke-width: 2.6; transition: opacity .25s; }
.goals li.done { color: var(--ink); }
.goals li.done .check { background: var(--green-b); border-color: var(--ink); }
.goals li.done .check .ic { opacity: 1; }

/* Step strip */
.strip-head { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 800; margin: 0 2px 8px; }
.strip-head span:last-child { color: var(--muted); font-weight: 600; }
.strip-scroll { overflow-x: auto; position: relative; padding-top: 2px; }
.strip ol { --n: 1; --p: 0; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(64px, 1fr)); min-width: calc(var(--n) * 64px); position: relative; }
.strip ol::before, .strip ol::after { content: ""; position: absolute; top: 14px; left: calc(50% / var(--n)); height: 2px; border-radius: 2px; }
.strip ol::before { right: calc(50% / var(--n)); background: var(--line); }
.strip ol::after { width: calc((100% - 100% / var(--n)) * var(--p)); background: var(--ink); transition: width .7s cubic-bezier(.65, 0, .35, 1); }
.strip ol.still::after, .strip ol.still .dot-n { transition: none; }
.step-btn { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 2px 6px; border: 0; background: none; font: inherit; color: var(--muted); cursor: pointer; border-radius: 8px; }
.step-btn .dot-n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 800; border: 1.3px solid var(--muted); background: var(--card); color: var(--muted); transition: background .25s, border-color .25s, transform .25s, box-shadow .25s; }
.step-short { font-size: 11px; line-height: 1.25; text-align: center; }
.step-btn:hover .dot-n { border-color: var(--ink); color: var(--ink); }
.step-btn.past .dot-n { border-color: var(--ink); color: var(--ink); background: var(--card-2); }
.step-btn.past .step-short { color: var(--ink-2); }
.step-btn.current .dot-n { border-color: var(--ink); color: var(--ink); background: var(--green-b); transform: scale(1.1); box-shadow: 0 2px 0 var(--drop); }
.step-btn.current .step-short { color: var(--ink); font-weight: 800; }
.step-btn .try-mark { position: absolute; top: 0; left: calc(50% + 7px); width: 10px; height: 10px; border: 1.3px solid var(--ink); border-radius: 2.5px; background: var(--amber-b); transform: rotate(45deg); }

@container dio (max-width: 760px) {
  .page { padding: 14px 12px 20px; }
  .wt-head { flex-direction: column; align-items: flex-start; gap: 10px; }
  .wt-head h1 { font-size: 21px; }
  .stage { padding: 10px 8px 8px; }
  .explain { padding: 16px 14px 14px; }
  .stage-top { flex-direction: column-reverse; align-items: stretch; }
  .stage-controls { justify-content: flex-end; }
  .chip { min-width: 0; flex: 1 1 calc(33% - 8px); }
}
@media (max-width: 600px) {
  .scene-wrap { overflow-x: auto; overscroll-behavior-x: contain; }
  .scene { height: 380px; }
}

/* ================= Shared bits of the collection shell ================= */

a.btn { text-decoration: none; }
.dio-collection a { color: inherit; }
.muted { color: var(--muted); }
.tag { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 800; line-height: 1.45; padding: 0 7px; border-radius: 6px; border: 1.2px solid var(--tf); background: var(--tb); color: var(--tf); white-space: nowrap; }
.icon-btn { width: 34px; height: 34px; padding: 0; flex-shrink: 0; display: inline-grid; place-items: center; border-radius: 10px; border: 1.3px solid var(--ink); background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--drop); cursor: pointer; text-decoration: none; transition: transform .08s, box-shadow .08s, background .15s; }
.icon-btn:hover { background: var(--card-2); }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--drop); }
.icon-btn .ic { width: 16px; height: 16px; }
mark { background: var(--amber-b); color: inherit; border-radius: 3px; }

/* Messages in place of the stage: loading, a broken file, an item that cannot be opened */
.status { display: flex; gap: 14px; align-items: flex-start; max-width: 720px; margin: 4px 4px 0; padding: 20px 22px 18px; }
.status-icon { flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--tb); color: var(--tf); border: 1.3px solid var(--tf); }
.status-icon .ic { width: 18px; height: 18px; }
.status[aria-busy] .status-icon { animation: pulse 1.1s ease-in-out infinite alternate; }
.status-text { min-width: 0; }
.status h2 { font-size: 17px; line-height: 1.3; margin: 5px 0 8px; }
.status p { margin: 0 0 8px; color: var(--ink-2); }
.status p.muted { color: var(--muted); font-size: 12.5px; }
.status code { font: 12.5px var(--mono); background: var(--card-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; color: var(--ink); }
.status-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

/* ================= Collection: frame and map ================= */

.dio-collection { display: flex; align-items: flex-start; min-height: 100dvh; }
.dio-collection > .dio-main { flex: 1 1 0; }
.app-bar, .map-rail { display: none; }

.map { position: sticky; top: 16px; flex: 0 0 auto; width: 272px; height: calc(100dvh - 36px); margin: 16px 0 20px 20px; display: flex; flex-direction: column; overflow: hidden; }
.map-top { display: flex; align-items: flex-start; gap: 10px; padding: 14px 12px 12px 16px; border-bottom: 1px solid var(--line); }
.map-title { flex: 1; min-width: 0; display: flex; flex-direction: column; text-decoration: none; border-radius: 6px; }
.map-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.map-name { font-size: 14px; font-weight: 800; line-height: 1.3; }
.map-title:hover .map-name { text-decoration: underline; text-underline-offset: 3px; }
.map-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 10px 16px; }
.map-search { width: 100%; display: flex; align-items: center; gap: 8px; margin: 0 0 14px; padding: 7px 10px; font: 600 12.5px/1.2 var(--mono); color: var(--muted); background: var(--card-2); border: 1.2px solid var(--line); border-radius: 10px; cursor: pointer; text-align: left; }
.map-search span { flex: 1; }
.map-search:hover { border-color: var(--ink); color: var(--ink); }
.map-sec + .map-sec { margin-top: 14px; }
.map-sec-h { display: flex; align-items: baseline; gap: 7px; margin: 0 8px 4px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.map-sec-t { flex: 1; min-width: 0; }
.map-count { font-weight: 700; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.map-items { list-style: none; margin: 0; padding: 0; }
.map-item { display: flex; align-items: flex-start; gap: 7px; margin: 1px 0; padding: 6px 8px; border: 1.2px solid transparent; border-radius: 9px; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); text-decoration: none; }
a.map-item:hover { background: var(--card-2); color: var(--ink); }
.map-item[aria-current] { background: var(--green-b); border-color: var(--ink); color: var(--ink); font-weight: 800; box-shadow: 0 2px 0 var(--drop); }
.map-item.planned { color: var(--muted); cursor: default; }
.map-item-t { flex: 1; min-width: 0; }
.map-item .tag { margin-top: 1px; }
.num { flex-shrink: 0; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.tick { flex-shrink: 0; width: 17px; height: 17px; margin-top: 1px; border-radius: 5px; display: inline-grid; place-items: center; background: var(--green-b); color: var(--green-f); border: 1.2px solid var(--green-f); }
.tick .ic { width: 11px; height: 11px; stroke-width: 2.8; }
.map-progress { margin: 16px 8px 0; font-size: 11.5px; color: var(--muted); }

@media (min-width: 900px) {
  .dio-collection[data-map="collapsed"] .map { width: 58px; }
  .dio-collection[data-map="collapsed"] .map-top { flex-direction: column; align-items: center; padding: 12px 0; border-bottom: 0; }
  .dio-collection[data-map="collapsed"] .map-title,
  .dio-collection[data-map="collapsed"] .map-body { display: none; }
  .dio-collection[data-map="collapsed"] .map-rail { display: flex; flex-direction: column; align-items: center; gap: 10px; }
}
@media (min-width: 1100px) and (min-height: 640px) {
  .dio-collection { height: 100dvh; }
}
/* Narrow screens: a top bar, and the map becomes a drawer. */
@media (max-width: 899px) {
  .dio-collection { display: block; }
  .app-bar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20; padding: 10px 12px; background: var(--page); border-bottom: 1.3px solid var(--ink); }
  .app-bar-title { flex: 1; min-width: 0; font-size: 14px; font-weight: 800; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app-scrim { position: fixed; inset: 0; z-index: 30; background: var(--drop); opacity: .38; }
  .map { position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; width: min(320px, 86vw); height: auto; margin: 0; border-radius: 0 16px 16px 0; transform: translateX(-105%); visibility: hidden; transition: transform .22s ease, visibility 0s .22s; }
  .dio-collection[data-drawer="open"] .map { transform: none; visibility: visible; transition: transform .22s ease; }
}

/* ================= Collection: home view ================= */

.home { max-width: 1180px; margin: 0 auto; padding: 30px 28px 44px; }
.home-head { margin: 0 4px 8px; }
.home-head h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; font-weight: 800; letter-spacing: -0.02em; }
.home-head .summary { font-size: 14px; }
.home-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: 18px; }
.home-actions .btn { max-width: 100%; }
.home-actions .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-count { font-size: 12px; font-weight: 700; color: var(--muted); }
.home-empty { color: var(--muted); }
.home-sec { margin-top: 28px; }
.home-sec-h { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 4px 12px; font-size: 16px; font-weight: 800; }
.home-sec-h .num { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; border: 1.3px solid var(--ink); background: var(--card); color: var(--ink); font-size: 12px; box-shadow: 0 2px 0 var(--drop); }
.home-sec-h .pill { font-size: 11px; padding: 0 9px; }
.cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.cards > li { display: flex; }
.item-card { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 16px 18px 14px; background: var(--card); color: var(--ink); border: 1.3px solid var(--ink); border-radius: 16px; box-shadow: 0 3px 0 var(--drop); text-decoration: none; transition: transform .12s, box-shadow .12s; }
a.item-card:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--drop); }
a.item-card:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--drop); }
.item-card.planned { background: var(--card-2); color: var(--muted); border-color: var(--muted); border-style: dashed; box-shadow: none; }
.item-top { display: flex; align-items: baseline; gap: 9px; }
.item-title { font-size: 15px; font-weight: 800; line-height: 1.3; }
.item-summary { flex: 1; font-size: 12.5px; color: var(--ink-2); }
.item-card.planned .item-summary { color: var(--muted); }
.item-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.item-meta .pill { font-size: 11px; padding: 0 9px; box-shadow: 0 1.5px 0 var(--drop); }
.item-meta .pill .ic { width: 12px; height: 12px; }
@container dio (max-width: 760px) {
  .home { padding: 20px 14px 32px; }
  .home-head h1 { font-size: 23px; }
}

/* ================= Collection: search ================= */

.search-layer { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; }
.search-scrim { position: absolute; inset: 0; background: var(--drop); opacity: .38; }
.search-box { position: relative; width: min(640px, 100%); max-height: 74vh; display: flex; flex-direction: column; overflow: hidden; }
.search-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.search-row:focus-within { box-shadow: inset 0 -2.5px 0 var(--focus); }
.search-row > .ic { width: 18px; height: 18px; color: var(--muted); }
.search-row input { flex: 1; min-width: 0; padding: 4px 0; font: 600 15px/1.4 var(--mono); color: var(--ink); background: transparent; border: 0; outline: none; -webkit-appearance: none; appearance: none; }
.search-row input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.search-status { margin: 0; padding: 7px 16px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
.search-results { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
.search-results:empty { display: none; }
.hit { display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border: 1.2px solid transparent; border-radius: 10px; color: var(--ink); text-decoration: none; }
.hit:hover { background: var(--card-2); }
.hit:focus { background: var(--green-b); border-color: var(--ink); }
.hit-where { font-size: 10.5px; font-weight: 700; color: var(--muted); }
.hit-title { font-size: 13.5px; font-weight: 800; }
.hit-sub { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ================= Contact sheet (#/<id>/sheet) ================= */

.sheet { padding: 18px 24px 32px; }
.sheet-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.sheet-head { align-items: flex-start; }
.sheet-counts { margin: 4px 0 0; font-size: 12px; font-weight: 700; color: var(--muted); }
.sheet-checks { margin: 0 4px 18px; padding: 14px 18px; }
.sheet-checks .section-h { margin: 0 0 8px; }
.sheet-findings { list-style: none; margin: 0; padding: 0; }
.sheet-findings li { display: flex; gap: 9px; align-items: flex-start; margin: 5px 0; font-size: 12.5px; line-height: 1.5; }
.sheet-findings .tag { flex-shrink: 0; margin-top: 2px; }
.sheet-clear { margin: 0; font-weight: 800; color: var(--green-f); }
.sheet-uncovered { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
/* Tiles at least 500 px wide: a still keeps the reference framing (960 px wide), so narrower tiles shrink labels below reading size. */
.sheet-grid { list-style: none; margin: 0; padding: 0 4px; display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 16px; }
.tile { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 10px 12px; }
.tile-option { background: var(--card-2); border-style: dashed; }
